<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>دخول الطالب — دوري المسابقات</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:rgba(6,10,28,.6);backdrop-filter:blur(10px);position:sticky;top:0;z-index:5}
  .me{display:flex;align-items:center;gap:10px}
  .avatar{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,var(--pri),var(--pri2))}
  .score-pill{font-weight:900;font-size:1.1rem;padding:6px 14px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
  main{max-width:900px;margin:0 auto;padding:28px 18px 60px}
  .center{min-height:calc(100vh - 160px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
  .join{max-width:560px;width:100%;margin:30px auto}
  .step{margin-top:22px}
  .step h4{margin-bottom:10px;font-size:.95rem;color:var(--muted)}
  .pick{display:flex;flex-wrap:wrap;gap:10px}
  .pick button{flex:1;min-width:90px;padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-weight:800;cursor:pointer;transition:.15s}
  .pick button:hover{background:rgba(255,255,255,.1)}
  .pick button.on{background:linear-gradient(135deg,var(--pri),#4f46e5);border-color:transparent;box-shadow:0 6px 20px rgba(124,92,255,.45)}
  .qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:800}
  .qtext{font-size:clamp(1.4rem,3.6vw,2.1rem);font-weight:900;text-align:center;padding:26px 18px;margin:16px 0 22px;line-height:1.6}
  .result-ico{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;animation:pop .4s ease-out}
  .result-ico .ico{width:64px;height:64px;stroke-width:3}
  .result-ico.ok{background:radial-gradient(circle,#22c55e,#15803d);box-shadow:0 0 60px rgba(34,197,94,.6)}
  .result-ico.bad{background:radial-gradient(circle,#ef4444,#b91c1c);box-shadow:0 0 60px rgba(239,68,68,.55)}
  .result-ico.late{background:radial-gradient(circle,#64748b,#334155)}
  .pts{font-size:3rem;font-weight:900}
  .mini-vs{display:flex;align-items:center;gap:14px;justify-content:center;font-size:1.6rem;font-weight:900}
  .mini-vs .t{padding:10px 22px;border-radius:14px;background:color-mix(in srgb,var(--team) 30%,transparent);border:1px solid var(--team)}
  .mini-vs .t.mine{box-shadow:0 0 0 3px #fff3,0 0 30px color-mix(in srgb,var(--team) 60%,transparent)}
  .stat-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .stat-row .card{padding:14px 22px;min-width:120px}
</style>
</head>
<body>
<div id="top"></div>
<main id="app"><div class="center"><div class="spinner"></div></div></main>
<script src="/js/socket.io.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/play.js"></script>
</body>
</html>
